name: M3 text recipe qualification
on:
  pull_request:
    paths: ['.m3/text-integration/**', 'lucene/core/src/java/org/apache/lucene/analysis/CharArrayMap.java', '.github/workflows/m3-text-recipe-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Synexia receiver and generated source
        run: mvn -B -ntp -f .m3/text-integration/pom.xml verify
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-text-qualification
          path: .m3/text-integration/target/qualification/logs/
