name: M3 text recipe qualification
on:
  pull_request:
    paths: ['.m3/text-integration/**', 'lucene/core/src/java/org/apache/lucene/analysis/CharArrayMap.java', '.github/workflows/m3-text-recipe-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-text-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-recipe:
    name: Qualify bounded text recipe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Synexia receiver and generated source
        run: mvn -B -ntp -f .m3/text-integration/pom.xml verify
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-text-qualification
          path: .m3/text-integration/target/qualification/logs/
